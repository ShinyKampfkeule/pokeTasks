# Use postgres/example user/password credentials

services:
  poketasks:
    image: postgres
    restart: always
    shm_size: 512mb
    ports:
      - 5436:5432
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
